<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowMind AI - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#08111f,#11203b,#08111f);
}

.card{
    width:380px;
    background:#162337;
    border:1px solid #00e5ff;
    border-radius:20px;
    padding:35px;
    box-shadow:0 0 30px rgba(0,229,255,.25);
    color:white;
}

.logo{
    font-size:52px;
    text-align:center;
    margin-bottom:12px;
}

h2{
    text-align:center;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#9fb3c8;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:13px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
}

button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#00cfff;
    color:#08111f;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#00e5ff;
}

.error{
    color:#ff8080;
    text-align:center;
    margin-bottom:12px;
}

.footer{
    text-align:center;
    margin-top:18px;
}

.footer a{
    color:#00e5ff;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🚦</div>

<h2>FlowMind AI</h2>
<p class="subtitle">Traffic Control Center</p>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="footer">
    Don't have an account?
    <a href="/signup">Create Account</a>
</div>

</div>

</body>
</html>
