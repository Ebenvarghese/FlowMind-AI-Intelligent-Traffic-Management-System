<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - ITMS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}
.card{
    width:390px;
    background:rgba(30,41,59,.95);
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
}
.logo{text-align:center;font-size:52px;margin-bottom:10px;}
h2{text-align:center;margin-bottom:8px;}
p.subtitle{text-align:center;color:#94a3b8;margin-bottom:25px;}
input{
    width:100%;
    padding:13px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:#334155;
    color:white;
}
button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}
button:hover{background:#1d4ed8;}
.error{color:#f87171;text-align:center;margin-bottom:10px;}
a{color:#60a5fa;text-decoration:none;}
.footer{text-align:center;margin-top:20px;font-size:14px;}
</style>
</head>
<body>
<div class="card">
<div class="logo">🚦</div>
<h2>Create Account</h2>
<p class="subtitle">AI Traffic Management System</p>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<form method="POST">
<input type="text" name="username" placeholder="Choose Username" required>
<input type="password" name="password" placeholder="Password" required>
<input type="password" name="confirm_password" placeholder="Confirm Password" required>
<button type="submit">Create Account</button>
</form>
<div class="footer">
Already have an account? <a href="/">Login</a>
</div>
</div>
</body>
</html>
